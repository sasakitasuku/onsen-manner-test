<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クイズ - 温泉マナー検定</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
</head>
<body>
    <div class="container">
        <div class="progress-container" style="text-align: center; margin: 15px 0;">
            <div class="progress" id="progress-text">第1問 / 15問中</div>
            <progress id="quiz-progress" value="1" max="15" style="width: 100%; height: 15px; margin-top: 5px;"></progress>
        </div>
        
        <div id="quiz-area">
            <div class="question-text" id="question-text">ここに問題文が表示されます</div>
            <div class="btn-group">
                <button class="answer-btn btn-maru" id="btn-true">〇</button>
                <button class="answer-btn btn-batsu" id="btn-false">✖</button>
            </div>
        </div>

        <div id="explanation-area">
            <div class="result-mark" id="result-mark"></div>
            <h3 id="correct-answer-text"></h3>
            <div class="explanation-text" id="explanation-text">ここに解説が表示されます</div>
            <button class="next-btn" id="next-btn">次の問題へ</button>
        </div>
    </div>

    <script src="js/quiz.js"></script>
</body>
</html>
