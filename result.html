<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最終結果 - 温泉マナー検定</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <style>
        .result-container {
            background: #fff; width: 100%; max-width: 480px; padding: 40px 20px;
            border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center;
        }
        .score-title { font-size: 1.2rem; color: #7f8c8d; margin-bottom: 10px; }
        .score-display { font-size: 3rem; font-weight: bold; color: #2c3e50; margin-bottom: 20px; }
        .score-display span { color: #e74c3c; font-size: 4rem; }
        #coupon-area { display: none; background: #fff3cd; border: 2px dashed #ffc107; padding: 20px; border-radius: 10px; margin: 20px 0; }
        .coupon-title { font-size: 1.2rem; font-weight: bold; color: #856404; margin-bottom: 10px; }
        .coupon-code { font-size: 1.5rem; font-weight: bold; letter-spacing: 2px; color: #d32f2f; background: #fff; padding: 10px; border-radius: 5px; }
        #retry-area { display: none; margin: 20px 0; }
        .send-btn { width: 100%; padding: 15px; font-size: 1.1rem; font-weight: bold; color: #fff; background-color: #27ae60; border: none; border-radius: 30px; cursor: pointer; transition: 0.3s; margin-top: 20px; }
        .send-btn:active { background-color: #2ecc71; transform: translateY(2px); }
        .retry-btn { background-color: #95a5a6; margin-top: 10px; }
    </style>
</head>
<body>
<div class="result-container">
    <div class="score-title">あなたの正答数</div>
    <div class="score-display"><span id="final-score">0</span> / <span id="total-questions">15</span></div>
    <p id="result-message" style="font-weight: bold; color: #34495e; margin-bottom: 30px;"></p>
    <div id="coupon-area">
        <div class="coupon-title">🎉全問正解特典🎉</div>
        <p style="font-size: 0.9rem; margin-bottom: 10px;">以下の模擬クーポンコードをスクリーンショットで保存してください。</p>
        <div class="coupon-code">ONSEN-2026-THX</div>
    </div>
    <hr style="border: none; border-top: 1px solid #eee; margin: 30px 0;">
    <p style="font-size: 0.85rem; color: #7f8c8d; line-height: 1.5; margin-bottom: 20px;">
        【重要】最後に下のボタンからアンケートへ進み、データを送信してください。<br>※送信を完了しないとデータが記録されません。
    </p>
    <button class="send-btn" id="go-survey-btn">アンケートへ進む</button>
</div>
<script src="js/result.js"></script>
</body>
</html>
