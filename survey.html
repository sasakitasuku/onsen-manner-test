<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アンケート - 温泉マナー検定</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <style>
        .survey-container {
            background: #fff; width: 100%; max-width: 480px; padding: 30px 20px;
            border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: left;
            margin: 20px auto; box-sizing: border-box;
        }
        h2 { text-align: center; border-bottom: 2px solid #3498db; padding-bottom: 10px; margin-bottom: 20px;}
        .form-group { margin-bottom: 25px; }
        .form-group label { font-weight: bold; display: block; margin-bottom: 10px; color: #2c3e50; }
        .radio-group div { margin-bottom: 8px; }
        .send-btn { width: 100%; padding: 15px; font-size: 1.1rem; font-weight: bold; color: #fff; background-color: #27ae60; border: none; border-radius: 30px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .send-btn:active { background-color: #2ecc71; transform: translateY(2px); }
        .send-btn:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="survey-container">
        <h2>事後アンケート</h2>
        <p style="font-size: 0.9rem; margin-bottom: 20px; color: #7f8c8d; text-align: center;">最後に以下の質問にお答えください。</p>
        <form id="surveyForm">
            <div class="form-group">
                <label>1.本アプリによるマナー学習は有用でしたか?</label>
                <div class="radio-group">
                    <div><input type="radio" name="q1" value="5" required> 非常に有用</div>
                    <div><input type="radio" name="q1" value="4"> 有用</div>
                    <div><input type="radio" name="q1" value="3"> どちらともいえない</div>
                    <div><input type="radio" name="q1" value="2"> 無用</div>
                    <div><input type="radio" name="q1" value="1"> 非常に無用</div>
                </div>
            </div>
            <div class="form-group">
                <label>2.今後宿泊する際のマナーに対する意識は向上しましたか?</label>
                <div class="radio-group">
                    <div><input type="radio" name="q2" value="5" required> 非常に向上した</div>
                    <div><input type="radio" name="q2" value="4"> 向上した</div>
                    <div><input type="radio" name="q2" value="3"> 変わらない</div>
                    <div><input type="radio" name="q2" value="2"> 低下した</div>
                    <div><input type="radio" name="q2" value="1"> 非常に低下した</div>
                </div>
            </div>
            <div class="form-group">
                <label>3.クイズの難易度は適切でしたか?</label>
                <div class="radio-group">
                    <div><input type="radio" name="q3" value="5" required> 非常に適切</div>
                    <div><input type="radio" name="q3" value="4"> 適切</div>
                    <div><input type="radio" name="q3" value="3"> どちらともいえない</div>
                    <div><input type="radio" name="q3" value="2"> 不適切</div>
                    <div><input type="radio" name="q3" value="1"> 非常に不適切</div>
                </div>
            </div>
            <div class="form-group">
                <label>4.本アプリを通して、マナー違反が施設に与える「損害」への理解は深まりましたか?</label>
                <div class="radio-group">
                    <div><input type="radio" name="q4" value="5" required> 非常に深まった</div>
                    <div><input type="radio" name="q4" value="4"> 深まった</div>
                    <div><input type="radio" name="q4" value="3"> どちらともいえない</div>
                    <div><input type="radio" name="q4" value="2"> あまり深まらない</div>
                    <div><input type="radio" name="q4" value="1"> 全く深まらない</div>
                </div>
            </div>
            <div class="form-group">
                <label>5. 今後もこのような学習アプリを利用したいと思いますか?</label>
                <div class="radio-group">
                    <div><input type="radio" name="q5" value="5" required> 非常に思う</div>
                    <div><input type="radio" name="q5" value="4"> 思う</div>
                    <div><input type="radio" name="q5" value="3"> どちらともいえない</div>
                    <div><input type="radio" name="q5" value="2"> 思わない</div>
                    <div><input type="radio" name="q5" value="1"> 全く思わない</div>
                </div>
            </div>
            <div class="form-group" id="reward-question-area" style="display: none; background-color: #fff3cd; padding: 15px; border-radius: 8px; border: 1px solid #ffeeba;">
                <label style="color: #856404;">【特別質問】<br>全問正解の報酬を獲得したことで、マナーを学習する意欲や、実践しようというやる気は高まりましたか?</label>
                <div class="radio-group">
                    <div><input type="radio" name="q_reward" value="5"> 非常に高まった</div>
                    <div><input type="radio" name="q_reward" value="4"> 高まった</div>
                    <div><input type="radio" name="q_reward" value="3"> どちらともいえない</div>
                    <div><input type="radio" name="q_reward" value="2"> あまり高まらない</div>
                    <div><input type="radio" name="q_reward" value="1"> 全く高まらない</div>
                </div>
            </div>
            <div class="form-group">
                <label>自由記述(ご意見・ご感想等)</label>
                <textarea id="freeText" rows="4" style="width: 100%; border-radius: 6px; border: 1px solid #bdc3c7; padding: 10px; box-sizing: border-box; font-size: 1rem;"></textarea>
            </div>
            <button type="submit" id="submitSurveyBtn" class="send-btn">全てのデータを送信して終了</button>
        </form>
    </div>
    <script src="js/survey.js"></script>
</body>
</html>
